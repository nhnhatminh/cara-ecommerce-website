services:
  db:
    image: mysql:8.0
    container_name: cara_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Cara@1234
      MYSQL_DATABASE: cara_ecommerce_db
      MYSQL_USER: cara_admin
      MYSQL_PASSWORD: Cara@1234
    volumes:
      - db_data:/var/lib/mysql
      - ./database/cara_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "3308:3306"
    networks:
      - cara_network

  web:
    build: .
    container_name: cara_web
    restart: always
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: cara_ecommerce_db
      DB_USER: cara_admin
      DB_PASS: Cara@1234
    depends_on:
      - db
    networks:
      - cara_network

networks:
  cara_network:
    driver: bridge

volumes:
  db_data: